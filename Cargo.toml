[package]
name = "duckdns-updater"
version = "1.0.0"
edition = "2021"
authors = ["DuckDNS Updater Team"]
description = "Fast, lightweight cross-platform DuckDNS Dynamic DNS updater with GUI and System Tray"

[dependencies]
eframe = "0.29"
egui = "0.29"
ureq = { version = "2.10", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
dirs = "5.0"
tray-icon = "0.19"
notify-rust = "4.11"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser", "winnt"] }


[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[build-dependencies]
winres = "0.1.12"
