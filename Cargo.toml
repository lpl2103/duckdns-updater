[package]
name = "duckdns-updater"
version = "1.2.1"
edition = "2021"
authors = ["Leandro Pinheiro <engenharia@duckdns-updater.local>"]
description = "Atualizador nativo de IP público para DuckDNS com WinUI 3 Fluent Dark, Multi-Domínio, Auto-Start e Auto-Updater"

[dependencies]
eframe = "0.29"
egui = "0.29"
ureq = { version = "2.10", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tray-icon = "0.19"
notify-rust = "4.11"
base64 = "0.22"


[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser", "winnt"] }
winreg = "0.55"


[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
embed-resource = "2"
image = { version = "0.25", default-features = false, features = ["ico", "png"] }

